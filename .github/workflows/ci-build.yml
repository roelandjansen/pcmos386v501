name: Build
on:
  pull_request:
    types:
      - opened
      - edited
      - ready_for_review
      - reopened
      - synchronize
  push:

jobs:
  build:
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Package Install
      run: ./ci_prereq.sh

    - name: Build
      id: build
      run: ./build.sh
    - name: Log
      if: ${{ always() && (steps.build.outcome == 'failure') }}
      run: |
        echo "output.log"
        cat ~/.dosemu/boot.log
